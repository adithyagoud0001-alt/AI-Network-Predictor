services:
  postgres:
    image: postgres:16-alpine
    container_name: network_predictor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-network_predictor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d network_predictor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: network_predictor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-network_predictor}
      APP_ENV: production
      DEBUG: "False"
      HOST: "0.0.0.0"
      PORT: "8000"
      COLLECTOR_INTERVAL_SECONDS: "5"
      DEFAULT_PING_TARGET: "8.8.8.8"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/ml/models:/app/app/ml/models
      - ./backend/app/data/datasets:/app/app/data/datasets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network_predictor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
